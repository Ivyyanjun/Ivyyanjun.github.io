  team: "Project Team (Arizona State University)"
  pi: "LYU Yanjun (Designer & Developer of the embodied game)"
  role: participating
  years: "2023 - 2028"
  desc: "Designed and developed the WaterSIMmersive embodied game, which helps children learn complex scientific processes such as the geographic distribution of water resources, groundwater formation, and evaporation, while encouraging collaboration and social interaction among children to support healthy social-emotional development."
