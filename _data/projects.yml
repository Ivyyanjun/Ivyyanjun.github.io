# Projects page data. Newest first.
# Fields:
#   title:       English title (required)
#   title_zh:    Chinese title (optional)
#   funder:      funding body (optional)
#   funder_link: URL for the funder / award page (optional)
#   award:       award number (optional)
#   amount:      funding amount (optional)
