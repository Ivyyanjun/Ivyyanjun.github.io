#   pi:          e.g. "LYU Yanjun (Lead)" or your role (optional)
#   role:        leading  OR  participating   (required, lowercase)
#   years:       e.g. "2026 -" or "2022 - 2025" (optional)
#   desc:        short description (optional)
#   logos:       list of image files in /images/ (optional)

- title: "Interpretable AI Aesthetics: Empowering Artists to Shape AI through Human-AI Co-Creation"
  title_zh: "可解释的 AI 美学：人与 AI 共创中艺术家对 AI 美学的主动塑造"
  team: "Project Team （CAFA）"
  funder: "Central Academy of Fine Arts (CAFA)"
  pi: "LYU Yanjun"
  role: leading
  recruiting: "Students interested in (Chinese-style) AI aesthetics, especially those skilled in computer vision or cognitive psychology, are warmly welcome to design with us! 欢迎对 AI 美学和中国式 AI 美学感兴趣、擅长计算机视觉或认知心理学的同学加入，一起设计！"
  role: leading
  years: "2026.11 - (Just Launched)"
  desc: "Treats AI aesthetics as an emerging aesthetic form. By training models to learn aesthetic paradigms, the project makes the aesthetic dimensions learned by AI interpretable, and develops human-AI co-creation tools that empower artists to actively shape AI aesthetics, rather than be shaped by them."

- title: "AI-Empowered Mental Well-being Support for University Students"
  title_zh: "AI 赋能下的大学生心理健康研究"
  funder: "Central Academy of Fine Arts (CAFA)"
  team: "Project Team (CAFA & HKUST)"
  pi: "LYU Yanjun (Lead), LYU Hanfang (Co-Lead)"
  recruiting: "This project has just started — students interested in HCI design and human-AI interaction are warmly welcome to join us! 项目刚刚启动，欢迎对人机交互设计、人与 AI 交互感兴趣的同学加入！"
  role: leading
  years: "2026.11 - 2027.11"
  desc: "Explores how artificial intelligence can be leveraged to understand and support the mental well-being of university students, designing human-centered AI tools that promote emotional awareness, self-regulation, and timely access to support."
  logos:
    - "logo-cafa.png"
    - "logo-hkust (1).png"

- title: "WaterSIMmersive"
  title_zh: "WaterSIMmersive 水资源具身沉浸式学习游戏"
  funder: "U.S. National Science Foundation (NSF)"
  funder_link: "https://www.nsf.gov/awardsearch/showAward?AWD_ID=2314259"
  award: "2314259"
